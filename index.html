<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LSSD MCB · Генератор BBCode Форм</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            mcb: {
              bg: '#0c100d',
              card: '#131a14',
              border: '#253327',
              olive: '#1e2b16',
              oliveLight: '#2b3e20',
              sage: '#9aa694',
              silver: '#c4c9c2',
              crimson: '#9e2a2b',
              crimsonLight: '#b93536',
              gold: '#d4af37'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0c100d;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
    /* Стилизация скроллбара */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0c100d;
    }
    ::-webkit-scrollbar-thumb {
      background: #253327;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #374b3a;
    }
    /* Стили для эмуляции форумного BBCode предпросмотра */
    .bb-preview-container {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      font-size: 13px;
      line-height: 1.55;
      color: #111;
    }
    .bb-divbox {
      padding: 16px 20px;
      margin-bottom: 4px;
      border: 1px solid rgba(0,0,0,0.18);
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      word-wrap: break-word;
    }
    .bb-hr {
      border: 0;
      border-top: 1px solid rgba(150, 150, 150, 0.45);
      margin: 8px 0;
    }
    .bb-list-ul {
      list-style-type: disc;
      padding-left: 26px;
      margin: 4px 0;
    }
    .bb-list-ol {
      list-style-type: decimal;
      padding-left: 26px;
      margin: 4px 0;
    }
    .bb-spoiler {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 4px;
      margin: 6px 0;
      overflow: hidden;
    }
    .bb-spoiler-title {
      background: #e2e8f0;
      padding: 5px 10px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #1e293b;
    }
    .bb-spoiler-content {
      padding: 10px 12px;
      border-top: 1px solid #cbd5e1;
      background: #ffffff;
    }
    .input-field {
      width: 100%;
      background-color: #0e1410;
      border: 1px solid #28372a;
      border-radius: 0.5rem;
      padding: 0.55rem 0.75rem;
      font-size: 0.875rem;
      color: #f1f5f9;
      transition: all 0.15s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: #9aa694;
      box-shadow: 0 0 0 2px rgba(154, 166, 148, 0.15);
    }
    .input-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9aa694;
      margin-bottom: 0.35rem;
    }
    .input-field:hover{border-color:#3a4f3d}
    .chk{width:16px;height:16px;accent-color:#9e2a2b;cursor:pointer;flex-shrink:0}
    button[onclick*="splice"]{border-radius:.375rem;transition:.15s;padding:.25rem .5rem}
    button[onclick*="splice"]:hover{background:rgba(158,42,43,.22);color:#fca5a5}
    #formBuilderContainer>div{transition:border-color .15s}
    #formBuilderContainer>div:hover{border-color:#34493a}
    .chev{transition:transform .2s;color:#9aa694;font-size:12px;margin-left:.6rem}
    .collapsed .chev{transform:rotate(-90deg)}
    .rowx{font-size:10px;font-weight:600;text-transform:none;letter-spacing:0;color:#71717a;margin-left:.6rem;cursor:pointer;background:none;border:0;padding:0}
    .rowx:hover{color:#f87171}
    .row-off input,.row-off textarea,.row-off select{opacity:.4;text-decoration:line-through}
    .row-off .rowx{color:#fbbf24}
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-mcb-crimson selection:text-white">

  <!-- Top Header -->
  <header class="bg-mcb-olive border-b border-mcb-border sticky top-0 z-30 shadow-lg">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold tracking-widest uppercase px-2 py-0.5 rounded bg-mcb-crimson text-white">MCB</span>
            <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-white uppercase">
              Major Crimes Bureau · Генератор Документов
            </h1>
          </div>
          <p class="text-xs text-mcb-sage tracking-wider uppercase mt-0.5">
            Los Santos County Sheriff's Department · Официальные BBCode шаблоны
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <button onclick="fillSampleData()" class="px-3.5 py-2 rounded-lg text-xs font-semibold bg-mcb-oliveLight hover:bg-[#354c28] text-mcb-silver border border-mcb-sage/30 transition flex items-center gap-1.5 shadow-sm">
          <svg class="w-4 h-4 text-mcb-sage" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Заполнить примером
        </button>
        <button onclick="resetCurrentForm()" class="px-3.5 py-2 rounded-lg text-xs font-semibold bg-zinc-900/80 hover:bg-red-950/60 text-zinc-300 hover:text-red-200 border border-zinc-800 hover:border-red-800/50 transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Очистить форму
        </button>
        <button onclick="resetAllForms(this)" title="Сбросить все 8 форм и структуру (профиль сотрудника сохранится)" class="px-3.5 py-2 rounded-lg text-xs font-semibold bg-mcb-crimson/20 hover:bg-mcb-crimson/50 text-red-200 border border-mcb-crimson/50 transition flex items-center gap-1.5">
          🗂 Новое дело
        </button>
      </div>
    </div>
  </header>

  <!-- Global Detective Profile Bar -->
  <section class="bg-mcb-card border-b border-mcb-border">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 py-3">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-mcb-sage shrink-0">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Профиль сотрудника (автозаполнение):
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-2.5 flex-1 max-w-5xl">
          <div>
            <input type="text" id="prof_rank" placeholder="Звание (напр. Detective)" class="input-field !py-1.5 !text-xs" oninput="saveProfile()">
          </div>
          <div>
            <input type="text" id="prof_name" placeholder="Имя Фамилия (Name Surname)" class="input-field !py-1.5 !text-xs" oninput="saveProfile()">
          </div>
          <div>
            <input type="text" id="prof_serial" placeholder="Серийный № (напр. 4812)" class="input-field !py-1.5 !text-xs" oninput="saveProfile()">
          </div>
          <div>
            <input type="text" id="prof_case" placeholder="Текущий CASE ID (CF-26-001)" class="input-field !py-1.5 !text-xs" oninput="saveProfile()">
          </div>
          <button onclick="applyProfileToCurrentForm()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-mcb-crimson hover:bg-mcb-crimsonLight text-white transition flex items-center justify-center gap-1.5 shadow">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            Подставить в поля
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Form Selector Navigation Tabs -->
  <nav class="bg-[#101611] border-b border-mcb-border sticky top-[65px] z-20 overflow-x-auto">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 flex items-center gap-1.5 py-2.5 min-w-max" id="formTabs">
      <!-- Populated by JS -->
    </div>
  </nav>

  <!-- Main Workspace (2 Columns) -->
  <main class="max-w-[1600px] w-full mx-auto px-4 sm:px-6 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <!-- Left Column: Dynamic Form Builder -->
    <div class="lg:col-span-7 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2"><div class="flex items-center gap-1 bg-[#101611] p-1 rounded-lg border border-mcb-border w-fit">
        <button id="lvForm" onclick="setLeftView('form')" class="px-3.5 py-1.5 rounded-md text-xs font-semibold transition bg-mcb-olive text-white shadow">✏️ Поля формы</button>
        <button id="lvStruct" onclick="setLeftView('structure')" class="px-3.5 py-1.5 rounded-md text-xs font-semibold transition text-mcb-sage hover:text-white">🧩 Структура BBCode</button>
      </div>
        <div class="flex gap-3 text-xs text-mcb-sage">
          <button onclick="collapseAll(true)" class="hover:text-white">Свернуть всё</button>
          <button onclick="collapseAll(false)" class="hover:text-white">Развернуть всё</button>
        </div>
      </div>
      <div id="formBuilderContainer" class="space-y-5"></div>
      <div id="structurePanel" class="hidden space-y-3"></div>
    </div>

    <!-- Right Column: Sticky Preview & Raw BBCode Output -->
    <div class="lg:col-span-5 lg:sticky lg:top-[132px] space-y-4">
      <div class="bg-mcb-card border border-mcb-border rounded-xl overflow-hidden shadow-2xl">
        
        <!-- Preview Header & Mode Switcher -->
        <div class="bg-[#172118] px-4 py-3 border-b border-mcb-border flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-1 bg-[#0c100d] p-1 rounded-lg border border-mcb-border">
            <button id="tabBtnPreview" onclick="switchOutputTab('preview')" class="px-3 py-1.5 rounded-md text-xs font-semibold transition bg-mcb-olive text-white shadow">
              Визуальный предпросмотр
            </button>
            <button id="tabBtnCode" onclick="switchOutputTab('code')" class="px-3 py-1.5 rounded-md text-xs font-semibold transition text-mcb-sage hover:text-white">
              BBCode код
            </button>
          </div>

          <button onclick="copyBBCode()" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider bg-mcb-crimson hover:bg-mcb-crimsonLight text-white transition flex items-center gap-2 shadow-lg shadow-mcb-crimson/20 active:scale-95">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
            Скопировать BBCode
          </button>
        </div>

        <!-- Tab 1: Visual Forum Preview -->
        <div id="panelPreview" class="p-4 sm:p-5 bg-[#1a1d1a] max-h-[75vh] overflow-y-auto">
          <div id="liveVisualPreview" class="bb-preview-container"></div>
        </div>

        <!-- Tab 2: Raw BBCode Textarea -->
        <div id="panelCode" class="hidden p-4 bg-[#0b0f0c]">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-mcb-sage font-mono">Готовый код для вставки на форум:</span>
            <span id="charCount" class="text-xs text-zinc-500 font-mono">0 симв.</span>
          </div>
          <textarea id="rawBBCodeOutput" readonly class="w-full h-[65vh] bg-[#070a08] text-emerald-300/90 font-mono text-xs p-3.5 rounded-lg border border-mcb-border focus:outline-none resize-none selection:bg-mcb-crimson selection:text-white"></textarea>
        </div>

      </div>
    </div>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 bg-mcb-olive border border-mcb-sage/50 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
    <div class="w-7 h-7 rounded-full bg-emerald-600/30 border border-emerald-500 flex items-center justify-center text-emerald-400 shrink-0">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
    </div>
    <div>
      <p class="text-xs font-bold uppercase tracking-wider text-white" id="toastTitle">Скопировано!</p>
      <p class="text-xs text-mcb-silver" id="toastMsg">BBCode скопирован в буфер обмена.</p>
    </div>
  </div>

  <script>
    // ==========================================
    // ГЛОБАЛЬНОЕ СОСТОЯНИЕ И НАСТРОЙКИ ФОРМ
    // ==========================================
    const FORM_META = [
      { id: 'acceptance', num: '01', title: 'Решение о принятии', subtitle: 'Принятие / Отказ / Доработка' },
      { id: 'casefile',   num: '02', title: 'Casefile — Открытие', subtitle: 'Первичный документ дела' },
      { id: 'report',     num: '03', title: 'Отчёт о работе', subtitle: 'Ход следствия по датам' },
      { id: 'dossier',    num: '04', title: 'Досье фигурантов', subtitle: 'Личные данные и улики' },
      { id: 'expertise',  num: '05', title: 'Заключение экспертизы', subtitle: 'Экспертное исследование' },
      { id: 'charges',    num: '06', title: 'Предъявленные обвинения', subtitle: 'Статьи по фигурантам' },
      { id: 'conclusion', num: '07', title: 'Заключение по делу', subtitle: 'Итоги расследования' },
      { id: 'closure',    num: '08', title: 'Закрытие кейс-файла', subtitle: 'Финальный документ дела' }
    ];

    let activeFormId = 'acceptance';
    let state = {};

    // Форматирование текущей даты
    function getTodayDDMMYYYY() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dd}.${mm}.${yyyy}`;
    }

    function getTodayDDMMMYYYY() {
      const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mmm = months[d.getMonth()];
      const yyyy = d.getFullYear();
      return `${dd} ${mmm} ${yyyy}`;
    }

    // Инициализация дефолтного состояния всех 6 форм
    function getInitialState() {
      const today = getTodayDDMMYYYY();
      const todayEn = getTodayDDMMMYYYY();
      const prof = getStoredProfile();
      const fullRankName = (prof.rank && prof.name) ? `${prof.rank} ${prof.name}` : 'Det. Name Surname';
      const signRankName = (prof.rank && prof.name) ? `${prof.rank} — ${prof.name}` : 'Звание — Имя Фамилия';

      return {
        acceptance: {
          incomingNum: '001',
          reviewDate: today,
          applicant: 'Отдел / Бюро, звание Имя Фамилия',
          incidentType: 'Тип происшествия',
          requestDate: today,
          reviewer: fullRankName,
          reviewerSerial: prof.serial || '0000',
          decision: 'Принято в работу',
          basis: 'рапорт / отчёт об инциденте / заявление / материалы смежного дела',
          providedList: [
            'Название материала, автор, дата, ссылка',
            'Название материала, автор, дата, ссылка'
          ],
          summary: 'одним-двумя предложениями, что произошло и что просит заявитель.',
          justification: 'Укажите, почему дело подпадает (или не подпадает) под юрисдикцию МКБ: тяжесть преступления, участие нескольких лиц, нападение на сотрудников, связь с другими делами, наличие организованной группы.',
          blockMode: 'auto', // 'auto', 'both', 'only4', 'only5'
          caseId: prof.caseId ? `${prof.caseId} — Тип дела` : 'CF-YY-XXX — Тип дела',
          assignedDetective: `${fullRankName}, серийный номер ${prof.serial || '0000'}`,
          priority: 'Высокий',
          initialActions: ['Первое действие', 'Второе действие'],
          additionalMaterials: 'N/A',
          rejectReason: 'недостаточно оснований / не подпадает под юрисдикцию МКБ / нарушено оформление материалов',
          rejectRequirements: ['Требование 1', 'Требование 2'],
          recommendedUnit: 'N/A',
          signRankName: signRankName,
          signDate: today
        },

        conclusion: {
          caseId: prof.caseId ? `${prof.caseId} — Тип дела` : 'CF-YY-XXX — Тип дела',
          date: today,
          detective: fullRankName,
          serial: prof.serial || '0000',
          openDate: today,
          closeDate: today,
          decision: 'Передано в прокуратуру',
          summary: 'Кратко опишите суть дела: что произошло, когда и где, как было начато расследование и какие ключевые события произошли в ходе работы. Не более 5–7 предложений.',
          suspects: [
            {
              name: 'Имя Фамилия',
              status: 'Задержан',
              role: 'Исполнитель',
              charges: '§ XXX, § XXX, § XXX',
              evidence: 'ДНК, отпечатки, записи камер, показания',
              outcome: 'Передан в суд'
            },
            {
              name: 'Имя Фамилия',
              status: 'В розыске',
              role: 'Соучастник',
              charges: '§ XXX, § XXX',
              evidence: 'ДНК, отпечатки, записи камер, показания',
              outcome: 'Находится в розыске'
            }
          ],
          activities: 'обыски, допросы, экспертизы, осмотры (кратко, с количеством)',
          seizedEvidence: 'перечень основных вещественных доказательств',
          warrants: 'Search Warrant №000 — исполнен; Arrest Warrant №000 — исполнен',
          attachments: 'Ссылки на отчёты, досье, обвинения, фото и видео',
          conclusions: 'Подтверждена ли вина фигурантов, достаточно ли доказательств, какие версии отработаны.',
          unresolved: 'что осталось неустановленным (неопознанные лица, невозвращённое оружие, непроверенные версии) или N/A.',
          recommendations: 'дальнейшие действия: передача в суд, продолжение розыска, дополнительные экспертизы.',
          signRankName: signRankName,
          signDate: today
        },

        charges: {
          caseId: prof.caseId ? `${prof.caseId} — Тип дела` : 'CF-YY-XXX — Тип дела',
          date: today,
          suspects: [
            {
              name: 'Имя Фамилия',
              items: [
                '§ XXX. Название статьи (уточнение, если требуется)',
                '§ XXX. Название статьи',
                '§ XXX. Название статьи'
              ]
            },
            {
              name: 'Имя Фамилия',
              items: [
                '§ XXX. Название статьи (уточнение, если требуется)',
                '§ XXX. Название статьи'
              ]
            }
          ],
          signRankName: signRankName
        },

        report: {
          caseId: prof.caseId || 'CF-YY-XXX',
          reportNum: '001',
          date: today,
          investigation: 'Название дела, статья (например: Грабёж, ст. XXX)',
          executor: `${fullRankName}, серийный номер ${prof.serial || '0000'}`,
          period: `${today}, 14:00 — 18:00`,
          involved: 'Звание Имя Фамилия, Звание Имя Фамилия',
          logs: [
            {
              datetime: `${today} — 14:30`,
              steps: [
                'Краткое название действия. Что именно было проведено: где, когда, кем, какие предметы или места осматривались.',
                'Краткое название действия. Что обнаружено, какие объекты, лица или улики выявлены.',
                'Краткое название действия. Результат проведённой работы.'
              ]
            },
            {
              datetime: `${today} — 16:45`,
              steps: [
                'Краткое название действия. Описание проведённой работы.',
                'Краткое название действия. Описание проведённой работы.'
              ]
            }

    // ==========================================
    // ПРОФИЛЬ ДЕТЕКТИВА (LOCALSTORAGE)
    // ==========================================
    function getStoredProfile() {
      try {
        const raw = localStorage.getItem('lssd_mcb_profile');
        return raw ? JSON.parse(raw) : { rank: 'Det.', name: '', serial: '', caseId: '' };
      } catch (e) {
        return { rank: 'Det.', name: '', serial: '', caseId: '' };
      }
    }

    function loadProfileInputs() {
      const p = getStoredProfile();
      document.getElementById('prof_rank').value = p.rank || '';
      document.getElementById('prof_name').value = p.name || '';
      document.getElementById('prof_serial').value = p.serial || '';
      document.getElementById('prof_case').value = p.caseId || '';
    }

    function saveProfile() {
      const p = {
        rank: document.getElementById('prof_rank').value.trim(),
        name: document.getElementById('prof_name').value.trim(),
        serial: document.getElementById('prof_serial').value.trim(),
        caseId: document.getElementById('prof_case').value.trim()
      };
      try {
        localStorage.setItem('lssd_mcb_profile', JSON.stringify(p));
      } catch (e) {}
    }

    function applyProfileToCurrentForm() {
      saveProfile();
      const p = getStoredProfile();
      const fullRankName = [p.rank, p.name].filter(Boolean).join(' ') || 'Det. Name Surname';
      const signRankName = (p.rank && p.name) ? `${p.rank} — ${p.name}` : fullRankName;

      if (activeFormId === 'acceptance') {
        state.acceptance.reviewer = fullRankName;
        if (p.serial) state.acceptance.reviewerSerial = p.serial;
        state.acceptance.assignedDetective = `${fullRankName}, серийный номер ${p.serial || '0000'}`;
        if (p.caseId) state.acceptance.caseId = `${p.caseId} — ${state.acceptance.incidentType || 'Тип дела'}`;
        state.acceptance.signRankName = signRankName;
      } else if (activeFormId === 'conclusion') {
        state.conclusion.detective = fullRankName;
        if (p.serial) state.conclusion.serial = p.serial;
        if (p.caseId) state.conclusion.caseId = `${p.caseId} — Тип дела`;
        state.conclusion.signRankName = signRankName;
      } else if (activeFormId === 'charges') {
        if (p.caseId) state.charges.caseId = `${p.caseId} — Тип дела`;
        state.charges.signRankName = signRankName;
      } else if (activeFormId === 'report') {
        if (p.caseId) state.report.caseId = p.caseId;
        state.report.executor = `${fullRankName}, серийный номер ${p.serial || '0000'}`;
      } else if (activeFormId === 'dossier') {
        if (p.caseId) state.dossier.caseId = p.caseId;
      } else if (activeFormId === 'closure') {
        if (p.caseId) state.closure.caseId = `${p.caseId} — Тип дела`;
        state.closure.detective = fullRankName;
        if (p.serial) state.closure.serial = p.serial;
        state.closure.executor = signRankName;
      } else if (activeFormId === 'expertise') {
        if (p.caseId) state.expertise.caseId = p.caseId;
        state.expertise.assignedBy = fullRankName;
        state.expertise.signRankName = signRankName;
      } else if (activeFormId === 'casefile') {
        if (p.caseId) state.casefile.caseId = p.caseId;
        state.casefile.detective = fullRankName;
        if (p.serial) state.casefile.serial = p.serial;
      }

      renderFormBuilder();
      updateOutput();
      showToast('Профиль применён', 'Данные детектива и Case ID подставлены в текущую форму.');
    }

    // НАВИГАЦИЯ ПО ВКЛАДКАМ
    // ==========================================
    function renderTabs() {
      const container = document.getElementById('formTabs');
      container.innerHTML = FORM_META.map(f => {
        const isActive = f.id === activeFormId;
        return `
          <button onclick="selectForm('${f.id}')" class="group px-3.5 py-2 rounded-lg border text-left transition flex items-center gap-2.5 ${
            isActive
              ? 'bg-mcb-olive border-mcb-sage text-white shadow-md'
              : 'bg-[#141c15] border-mcb-border/70 text-zinc-400 hover:text-white hover:bg-[#1a241c]'
          }">
            <span class="text-xs font-mono font-bold px-1.5 py-0.5 rounded ${
              isActive ? 'bg-mcb-crimson text-white' : 'bg-zinc-800 text-mcb-sage group-hover:bg-zinc-700'
            }">${f.num}</span>
            <div>
              <div class="text-xs font-bold leading-tight">${f.title}</div>
              <div class="text-[10px] ${isActive ? 'text-mcb-silver' : 'text-zinc-500'}">${f.subtitle}</div>
            </div>
          </button>
        `;
      }).join('');
    }

    function selectForm(formId) {
      activeFormId = formId;
      renderTabs();
      renderFormBuilder();
      updateOutput();
    }

    function switchOutputTab(tab) {
      const btnPrev = document.getElementById('tabBtnPreview');
      const btnCode = document.getElementById('tabBtnCode');
      const panelPrev = document.getElementById('panelPreview');
      const panelCode = document.getElementById('panelCode');

      if (tab === 'preview') {
        panelPrev.classList.remove('hidden');
        panelCode.classList.add('hidden');
        btnPrev.className = 'px-3 py-1.5 rounded-md text-xs font-semibold transition bg-mcb-olive text-white shadow';
        btnCode.className = 'px-3 py-1.5 rounded-md text-xs font-semibold transition text-mcb-sage hover:text-white';
      } else {
        panelPrev.classList.add('hidden');
        panelCode.classList.remove('hidden');
        btnCode.className = 'px-3 py-1.5 rounded-md text-xs font-semibold transition bg-mcb-olive text-white shadow';
        btnPrev.className = 'px-3 py-1.5 rounded-md text-xs font-semibold transition text-mcb-sage hover:text-white';
      }
    }

    // ==========================================
    // ЭКРАНИРОВАНИЕ HTML ДЛЯ ИНПУТОВ
    // ==========================================
    function esc(str) {
      if (str === undefined || str === null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // ==========================================
    // ПАРСЕР BBCODE -> HTML ДЛЯ ПРЕДПРОСМОТРА
    // ==========================================
    function parseBBCodeToHTML(bb) {
      let html = bb
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // [hr][/hr]
      html = html.replace(/\[hr\]\[\/hr\]\n?/gi, '<hr class="bb-hr">');

      // [divbox=...]...[/divbox]
      html = html.replace(/\[divbox=([^\]]+)\]([\s\S]*?)\[\/divbox\]\n?/gi, (match, bg, content) => {
        const bgColor = bg.trim() === 'white' ? '#ffffff' : bg.trim();
        const textColor = bg.trim() === 'white' ? '#000000' : '#ffffff';
        return `<div class="bb-divbox" style="background-color: ${bgColor}; color: ${textColor};">${content}</div>`;
      });

      // Списки [list=1] и [list]
      html = html.replace(/\[list=1\]\n?([\s\S]*?)\[\/list\]\n?/gi, (match, inner) => {
        const items = inner.split('[*]').map(s => s.trim()).filter(Boolean);
        return `<ol class="bb-list-ol">${items.map(i => `<li>${i}</li>`).join('')}</ol>`;
      });

      html = html.replace(/\[list\]\n?([\s\S]*?)\[\/list\]\n?/gi, (match, inner) => {
        const items = inner.split('[*]').map(s => s.trim()).filter(Boolean);
        return `<ul class="bb-list-ul">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
      });

      // [spoiler=Title]...[/spoiler]
      html = html.replace(/\[spoiler=([^\]]+)\]([\s\S]*?)\[\/spoiler\]/gi, (match, title, content) => {
        return `<div class="bb-spoiler">
          <div class="bb-spoiler-title" onclick="this.nextElementSibling.classList.toggle('hidden')">
            <span>📁 Спойлер: ${title}</span>
            <span class="text-[10px] text-slate-500">Нажмите, чтобы открыть/скрыть</span>
          </div>
          <div class="bb-spoiler-content">${content}</div>
        </div>`;
      });

      // [size=X] (вложенные циклы на случай вложенности)
      const sizeMap = {
        '1': '10px',
        '2': '11px',
        '3': '14px',
        '4': '16px',
        '5': '20px',
        '6': '24px'
      };
      for (let i = 0; i < 3; i++) {
        html = html.replace(/\[size=(\d)\]([\s\S]*?)\[\/size\]/gi, (m, sz, c) => {
          const px = sizeMap[sz] || '13px';
          return `<span style="font-size: ${px}; line-height: 1.35;">${c}</span>`;
        });
      }

      // [color=...] (несколько проходов для вложенных цветов)
      for (let i = 0; i < 4; i++) {
        html = html.replace(/\[color=([^\]]+)\]([\s\S]*?)\[\/color\]/gi, '<span style="color: $1;">$2</span>');
      }

      // [b], [i], [center], [right]
      for (let i = 0; i < 3; i++) {
        html = html.replace(/\[b\]([\s\S]*?)\[\/b\]/gi, '<strong>$1</strong>');
        html = html.replace(/\[i\]([\s\S]*?)\[\/i\]/gi, '<em>$1</em>');
        html = html.replace(/\[center\]([\s\S]*?)\[\/center\]/gi, '<div style="text-align: center;">$1</div>');
        html = html.replace(/\[right\]([\s\S]*?)\[\/right\]/gi, '<div style="text-align: right;">$1</div>');
      }

      // Сохранение множественных пробелов в шапке и перевод строк
      html = html.replace(/    /g, '&nbsp;&nbsp;&nbsp;&nbsp;');
      html = html.replace(/\n/g, '<br>');

      return html;
    }

    function updateOutput() {
      const bb = finalizeBB(generateBBCode());
      document.getElementById('rawBBCodeOutput').value = bb;
      document.getElementById('charCount').textContent = `${bb.length} симв.`;
      document.getElementById('liveVisualPreview').innerHTML = parseBBCodeToHTML(bb);
      renderStructure(false);
      schedulePersist();
    }

        showToast('BBCode скопирован!', 'Код готов к вставке на форум LSSD MCB.');
      } catch (err) {
        showToast('Ошибка копирования', 'Выделите текст во вкладке BBCode код вручную.');
      }
      window.getSelection().removeAllRanges();
    }

    let toastTimeout = null;
    function showToast(title, msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastTitle').textContent = title;
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 3200);
    }


    // ==========================================
    // РЕДАКТОР СТРУКТУРЫ BBCODE (скрыть / переименовать / добавить)
    // ==========================================
    let edits = {};
    let lastReg = [];
    let lastSig = '';
    const collapsedCards = new Set();

    function getEd() {
      return edits[activeFormId] || (edits[activeFormId] = { hidden: {}, labels: {}, custom: {}, sections: [] });
    }

    const HEAD_RE = /\[color=#9e2a2b\]\[b\]▌\[\/b\]\[\/color\]\[size=3\]\[b\]\[color=#000000\] ([^\n]*?)\[\/color\]\[\/b\]\[\/size\]/g;
    const FIELD_RE = /^((?:\[hr\]\[\/hr\])?(?:\[color=#000000\])?)(\[\*\])?\[b\]([^\[\]\n]+?):\[\/b\](.*)$/;
    const TAG_RE = /\[(\/?)(b|i|color|size|center|right|spoiler|list)(=[^\]]*)?\]/g;
    const mkHead = t => `[color=#9e2a2b][b]▌[/b][/color][size=3][b][color=#000000] ${t}[/color][/b][/size]`;

    // закрывающие теги без пары внутри строки
    function strayClosers(s) {
      const st = [], out = [];
      let m; TAG_RE.lastIndex = 0;
      while ((m = TAG_RE.exec(s))) {
        if (!m[1]) st.push(m[2]);
        else if (st.length && st[st.length - 1] === m[2]) st.pop();
        else out.push(m[0]);
      }
      return out.join('');
    }

    function processBody(body, sKey, ed, fields) {
      const parts = body.split(/(\n|\u0001)/);
      const L = [];
      for (let i = 0; i < parts.length; i += 2) L.push({ t: parts[i], s: parts[i + 1] || '' });
      const out = [], cnt = {};
      let pending = '';
      for (let i = 0; i < L.length; i++) {
        const t = pending + L[i].t; pending = '';
        const m = FIELD_RE.exec(t);
        if (!m) { out.push({ t, s: L[i].s }); continue; }
        const open = m[1], bullet = m[2] || '', label = m[3], rest = m[4];
        const key = sKey + '|' + label + '|' + (cnt[label] = (cnt[label] || 0) + 1);
        let end = i, tail = rest;
        const nx = L[i + 1] ? L[i + 1].t : '';
        const isList = rest.trim() === '' && /^(\[list|•)/.test(nx);
        if (isList) {
          end = i + 1;
          if (nx.startsWith('•')) { while (end + 1 < L.length && /^•/.test(L[end + 1].t)) end++; tail = L[end].t; }
          else {
            while (end < L.length - 1 && !L[end].t.includes('[/list]')) end++;
            const lt = L[end].t; tail = lt.slice(lt.indexOf('[/list]') + 7);
          }
        }
        const grp = L.slice(i, end + 1).map(x => x.t).join('\n');
        const val = isList ? 'list' : rest.replace(/\u0002[^\u0003]*\u0003/g, '').replace(/\[[^\]]*\]/g, '').trim();
        fields.push({ key, label, paths: [...grp.matchAll(/\u0002([^\u0003]*)\u0003/g)].map(m => m[1]), empty: !isList && /^(n\/a|н\/д|—|-)?$/i.test(val) });
        if (!ed.hidden[key]) {
          const lab = ed.labels[key] !== undefined ? ed.labels[key] : label;
          out.push({ t: open + bullet + '[b]' + lab + ':[/b]' + rest, s: L[i].s });
          for (let j = i + 1; j <= end; j++) out.push(L[j]);
        } else {
          const stray = strayClosers(tail), rem = open + stray, sepEnd = L[end].s;
          if (rem === '') { /* строка удалена целиком */ }
          else if (stray === '' && sepEnd === '\n' && end + 1 < L.length) pending = open;
          else if (open === '' && out.length) out[out.length - 1].t += stray;
          else out.push({ t: rem, s: sepEnd });
        }
        i = end;
      }
      return out.map(o => o.t + o.s).join('');
    }

    function applyStructure(bb) {
      const ed = getEd();
      const heads = [...bb.matchAll(HEAD_RE)];
      lastReg = [];
      if (!heads.length) return bb;
      let res = bb.slice(0, heads[0].index), lastEnd = 0;
      heads.forEach((h, i) => {
        const start = h.index;
        const cands = [heads[i + 1] ? heads[i + 1].index : -1, bb.indexOf('\n[hr][/hr][right]', start), bb.indexOf('[/divbox]', start)].filter(x => x > start);
        const end = Math.min(...cands); lastEnd = end;
        const rawT = h[1], title = rawT.replace(/\u0002[^\u0003]*\u0003/g, ''), key = title.split(' — ')[0].trim();
        const fields = [];
        const rawBody = bb.slice(start + h[0].length, end);
        let body = processBody(rawBody, key, ed, fields);
        lastReg.push({ key, title, fields, paths: [...(rawT + rawBody).matchAll(/\u0002([^\u0003]*)\u0003/g)].map(m => m[1]) });
        if (ed.hidden[key]) return;
        const cf = (ed.custom[key] || []).map(c => `\n[b]${c.label}:[/b] ${c.value}`).join('');
        if (cf) body = /\[\/color\]\s*$/.test(body) ? body.replace(/\[\/color\](\s*)$/, cf + '[/color]$1') : body + cf;
        const ttl = ed.labels[key] !== undefined ? ed.labels[key] : title;
        res += mkHead(ttl) + body;
      });
      ed.sections.forEach(s => { res += `\n\n${mkHead(s.title)}\n[hr][/hr][color=#000000]${s.body}[/color]`; });
      return res + bb.slice(lastEnd);
    }

    function finalizeBB(bb) { return applyStructure(bb).replace(/\u0002[^\u0003]*\u0003/g, '').replace(/\u0001/g, ''); }

    function renderStructure(force) {
      const ed = getEd();
      const sig = activeFormId + '|' + lastReg.map(s => s.key + ':' + s.fields.length + ':' + (ed.custom[s.key] || []).length).join(',') + '|' + ed.sections.length;
      if (!force && sig === lastSig) return;
      lastSig = sig;
      const hid = Object.values(ed.hidden).filter(Boolean).length;
      let h = `
        <div class="bg-mcb-card border border-mcb-border rounded-xl p-4 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="text-sm font-bold uppercase tracking-wider text-white">Структура документа ${hid ? `<span class="ml-2 text-xs font-mono text-amber-400 normal-case">скрыто: ${hid}</span>` : ''}</h2>
            <p class="text-xs text-mcb-sage mt-1 max-w-xl">Снимите галочку — раздел или строка исчезнет из BBCode. Названия можно переименовать, а свои строки и целые разделы — добавить.</p>
          </div>
          <div class="flex gap-2">
            <button onclick="addSection()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-mcb-olive hover:bg-mcb-oliveLight text-white border border-mcb-sage/40 transition">+ Раздел</button>
            <button onclick="hideEmpty()" title="Скрыть все строки со значением N/A или пустым" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-mcb-olive hover:bg-mcb-oliveLight text-white border border-mcb-sage/40 transition">Скрыть N/A и пустые</button>
            <button onclick="resetStructure()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-zinc-900/80 hover:bg-red-950/60 text-zinc-300 border border-zinc-800 transition">Сбросить</button>
          </div>
        </div>`;
      lastReg.forEach((s, si) => {
        const sh = !!ed.hidden[s.key];
        h += `<div class="bg-mcb-card border border-mcb-border rounded-xl overflow-hidden">
          <div class="flex items-center gap-2.5 px-4 py-2.5 bg-[#172118] border-b border-mcb-border">
            <input type="checkbox" class="chk" ${sh ? '' : 'checked'} onchange="togSec(${si})" title="Показывать раздел">
            <input class="input-field !py-1 !text-xs !font-bold ${sh ? 'opacity-50 line-through' : ''}" value="${esc(ed.labels[s.key] !== undefined ? ed.labels[s.key] : s.title)}" oninput="setLabel(${si},-1,this.value)">
          </div>
          <div class="p-3 space-y-1.5 ${sh ? 'opacity-40 pointer-events-none' : ''}">
            ${s.fields.map((f, fi) => `<div class="flex items-center gap-2.5">
              <input type="checkbox" class="chk" ${ed.hidden[f.key] ? '' : 'checked'} onchange="togFld(${si},${fi})">
              <input class="input-field !py-1 !text-xs ${ed.hidden[f.key] ? 'opacity-50 line-through' : ''}" value="${esc(ed.labels[f.key] !== undefined ? ed.labels[f.key] : f.label)}" oninput="setLabel(${si},${fi},this.value)">
            </div>`).join('')}
            ${(ed.custom[s.key] || []).map((c, ci) => `<div class="flex items-center gap-2">
              <span class="text-mcb-gold text-sm w-4 text-center">★</span>
              <input class="input-field !py-1 !text-xs sm:!w-2/5" value="${esc(c.label)}" placeholder="Название" oninput="setCustom(${si},${ci},'label',this.value)">
              <input class="input-field !py-1 !text-xs" value="${esc(c.value)}" placeholder="Значение" oninput="setCustom(${si},${ci},'value',this.value)">
              <button onclick="delCustom(${si},${ci})" class="text-zinc-500 hover:text-red-400" title="Удалить">✕</button>
            </div>`).join('')}
            <button onclick="addCustom(${si})" class="text-xs font-semibold text-emerald-400 hover:text-emerald-300 pt-1">+ Добавить свою строку</button>
          </div>
        </div>`;
      });
      ed.sections.forEach((c, ci) => {
        h += `<div class="bg-mcb-card border border-mcb-gold/40 rounded-xl overflow-hidden">
          <div class="flex items-center gap-2.5 px-4 py-2.5 bg-[#1d1f12] border-b border-mcb-gold/30">
            <span class="text-mcb-gold">★</span>
            <input class="input-field !py-1 !text-xs !font-bold" value="${esc(c.title)}" oninput="setSec(${ci},'title',this.value)">
            <button onclick="delSec(${ci})" class="text-xs text-red-400 hover:text-red-300 shrink-0" title="Удалить раздел">Удалить</button>
          </div>
          <div class="p-3"><textarea rows="3" class="input-field !text-xs" oninput="setSec(${ci},'body',this.value)">${esc(c.body)}</textarea></div>
        </div>`;
      });
      document.getElementById('structurePanel').innerHTML = h;
    }

    function refreshStruct() { updateOutput(); renderStructure(true); paint(); }
    function togSec(si) { const e = getEd(), k = lastReg[si].key; e.hidden[k] = !e.hidden[k]; refreshStruct(); }
    function togFld(si, fi) { const e = getEd(), k = lastReg[si].fields[fi].key; e.hidden[k] = !e.hidden[k]; refreshStruct(); }
    function setLabel(si, fi, v) { getEd().labels[fi < 0 ? lastReg[si].key : lastReg[si].fields[fi].key] = v; updateOutput(); }
    function addCustom(si) { const e = getEd(), k = lastReg[si].key; (e.custom[k] = e.custom[k] || []).push({ label: 'Новое поле', value: 'Значение' }); refreshStruct(); }
    function setCustom(si, ci, p, v) { getEd().custom[lastReg[si].key][ci][p] = v; updateOutput(); }
    function delCustom(si, ci) { getEd().custom[lastReg[si].key].splice(ci, 1); refreshStruct(); }
    function addSection() { getEd().sections.push({ title: 'VI. НОВЫЙ РАЗДЕЛ', body: 'Текст раздела' }); refreshStruct(); }
    function setSec(ci, p, v) { getEd().sections[ci][p] = v; updateOutput(); }
    function delSec(ci) { getEd().sections.splice(ci, 1); refreshStruct(); }
    function resetStructure() { delete edits[activeFormId]; refreshStruct(); showToast('Структура сброшена', 'Все скрытые и добавленные элементы текущей формы убраны.'); }

    function setLeftView(v) {
      const isForm = v === 'form';
      document.getElementById('formBuilderContainer').classList.toggle('hidden', !isForm);
      document.getElementById('structurePanel').classList.toggle('hidden', isForm);
      const on = 'px-3.5 py-1.5 rounded-md text-xs font-semibold transition bg-mcb-olive text-white shadow';
      const off = 'px-3.5 py-1.5 rounded-md text-xs font-semibold transition text-mcb-sage hover:text-white';
      document.getElementById('lvForm').className = isForm ? on : off;
      document.getElementById('lvStruct').className = isForm ? off : on;
      if (!isForm) renderStructure(true); else paint();
    }

    // сворачиваемые карточки формы
    function enhanceCards() {
      [...document.getElementById('formBuilderContainer').children].forEach((card, ci) => {
        const head = card.firstElementChild;
        if (!head || !head.firstElementChild) return;
        const id = activeFormId + ci;
        const chev = document.createElement('span');
        chev.className = 'chev'; chev.textContent = '▾';
        head.firstElementChild.appendChild(chev);
        head.classList.add('cursor-pointer', 'select-none');
        const apply = () => {
          const c = collapsedCards.has(id);
          card.classList.toggle('collapsed', c);
          [...card.children].slice(1).forEach(el => el.classList.toggle('hidden', c));
        };
        head.onclick = e => {
          if (e.target.closest('button,input,select,textarea')) return;
          collapsedCards.has(id) ? collapsedCards.delete(id) : collapsedCards.add(id);
          apply();
        };
        apply();
      });
    }
    const _renderFormBuilder = renderFormBuilder;
    renderFormBuilder = function () { _renderFormBuilder(); finalizeBB(generateBBCode()); enhanceCards(); decorateInputs(); };


    // ---- отслеживание: какое поле формы попало в какую строку BBCode ----
    const RAW_KEYS = new Set(['decision', 'blockMode']);
    function trackProxy(obj, path) {
      return new Proxy(obj, {
        get(t, p) {
          const v = t[p];
          if (typeof p === 'symbol' || RAW_KEYS.has(p)) return v;
          if (typeof v === 'string') return '\u0002' + path + p + '\u0003' + v;
          if (v && typeof v === 'object') return trackProxy(v, path + p + '.');
          return v;
        }
      });
    }
    function generateBBCode() {
      const real = state;
      state = new Proxy(real, { get: (t, p) => (t[p] && typeof t[p] === 'object') ? trackProxy(t[p], '') : t[p] });
      try { return _gen(); } finally { state = real; }
    }

    // ---- кнопка «убрать из кода» рядом с каждой строкой формы ----
    let rowEntries = [];
    function pathOf(el) {
      const h = el.getAttribute('oninput') || el.getAttribute('onchange') || '';
      const m = h.match(/state\.\w+\.([\w.\[\]]+?)\s*=\s*this\.value/);
      return m ? m[1].replace(/\[(\d+)\]/g, '.$1') : null;
    }
    function paint() {
      const ed = getEd();
      rowEntries.forEach(r => {
        r.wrap.classList.toggle('row-off', !!(ed.hidden[r.key] || ed.hidden[r.sec]));
        r.btn.textContent = ed.hidden[r.key] ? '↩ вернуть' : '✕ убрать из кода';
      });
    }
    function decorateInputs() {
      rowEntries = [];
      document.getElementById('formBuilderContainer').querySelectorAll('input[type=text],textarea,select').forEach(el => {
        const path = pathOf(el); if (!path) return;
        let hit = null;
        for (const s of lastReg) {
          const f = s.fields.find(x => x.paths.includes(path));
          if (f) { hit = { key: f.key, sec: s.key }; break; }
          if (!s.fields.length && s.paths.includes(path)) { hit = { key: s.key, sec: s.key }; break; }
        }
        if (!hit) return;
        const par = el.parentElement;
        let host = par.querySelector(':scope > label.input-label'), wrap = par;
        if (!host && par.parentElement) { host = par.parentElement.querySelector(':scope > label.input-label'); wrap = par.parentElement; }
        if (!host) {
          const box = el.closest('.space-y-2');
          if (!box || box.querySelector('input[type=text],textarea') !== el) return;
          const head = box.previousElementSibling;
          host = head && head.querySelector('label.input-label'); wrap = box;
        }
        if (!host) return;
        let btn = host.querySelector('.rowx');
        if (!btn) {
          btn = document.createElement('button'); btn.type = 'button'; btn.className = 'rowx';
          btn.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); const e = getEd(); e.hidden[hit.key] = !e.hidden[hit.key]; paint(); updateOutput(); renderStructure(true); };
          host.appendChild(btn);
        }
        rowEntries.push({ key: hit.key, sec: hit.sec, wrap, btn });
      });
      paint();
    }
    function hideEmpty() {
      const ed = getEd(); let n = 0;
      lastReg.forEach(s => s.fields.forEach(f => { if (f.empty && !ed.hidden[f.key]) { ed.hidden[f.key] = true; n++; } }));
      refreshStruct();
      showToast('Готово', n ? `Скрыто строк: ${n}` : 'Строк со значением N/A не найдено.');
    }
    function collapseAll(c) {
      [...document.getElementById('formBuilderContainer').children].forEach((_, ci) => { const id = activeFormId + ci; c ? collapsedCards.add(id) : collapsedCards.delete(id); });
      renderFormBuilder();
    }
    let resetArm = null;
    function resetAllForms(btn) {
      if (!resetArm) {
        btn.dataset.o = btn.innerHTML; btn.innerHTML = '⚠ Нажмите ещё раз';
        resetArm = setTimeout(() => { btn.innerHTML = btn.dataset.o; resetArm = null; }, 3000);
        return;
      }
      clearTimeout(resetArm); resetArm = null; btn.innerHTML = btn.dataset.o;
      state = getInitialState(); edits = {}; collapsedCards.clear(); lastSig = '';
      try { localStorage.removeItem('lssd_mcb_saved'); } catch (e) {}
      renderFormBuilder(); updateOutput(); renderStructure(true);
      showToast('Новое дело', 'Все формы и структура сброшены. Профиль сотрудника сохранён.');
    }
    function uiFor(form) {
      return {
        f: (l, k, c = '') => `<div class="${c}"><label class="input-label">${l}</label><input type="text" class="input-field" value="${esc(state[form][k])}" oninput="state.${form}.${k} = this.value; updateOutput()"></div>`,
        t: (l, k, r = 2) => `<div><label class="input-label">${l}</label><textarea rows="${r}" class="input-field" oninput="state.${form}.${k} = this.value; updateOutput()">${esc(state[form][k])}</textarea></div>`,
        sel: (l, k, opts, c = '') => `<div class="${c}"><label class="input-label">${l}</label><select class="input-field" onchange="state.${form}.${k} = this.value; updateOutput()">${opts.map(o => `<option value="${esc(o)}" ${state[form][k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}${opts.includes(state[form][k]) ? '' : `<option value="${esc(state[form][k])}" selected>${esc(state[form][k])}</option>`}</select></div>`
      };
    }

    // автосохранение
    let persistTimer = null;
    function schedulePersist() {
      clearTimeout(persistTimer);
      persistTimer = setTimeout(() => {
        try { localStorage.setItem('lssd_mcb_saved', JSON.stringify({ state, edits })); } catch (e) {}
      }, 400);
    }

    // ==========================================
    // СТАРТ ПРИЛОЖЕНИЯ
    // ==========================================
    window.onload = function() {
      loadProfileInputs();
      state = getInitialState();
      try {
        const s = JSON.parse(localStorage.getItem('lssd_mcb_saved') || 'null');
        if (s) { for (const k in s.state) if (state[k]) state[k] = s.state[k]; edits = s.edits || {}; }
      } catch (e) {}
      renderTabs();
      renderFormBuilder();
      updateOutput();
    };
  </script>
</body>
</html>
